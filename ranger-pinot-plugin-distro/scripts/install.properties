# Location of the Pinot installation, relative to the extracted plugin tarball
# or absolute. Defaults to a sibling ../pinot directory.
COMPONENT_INSTALL_DIR_NAME=../pinot

# Pinot conf directories (broker and controller each load a .conf file from
# their own conf dir). Defaults below resolve to $PINOT_HOME/conf.
PINOT_BROKER_CONF_DIR=
PINOT_CONTROLLER_CONF_DIR=

#
# Location of Policy Manager URL
#
# Example:
# POLICY_MGR_URL=http://policymanager.xasecure.net:6080
#
POLICY_MGR_URL=

#
# This is the repository name created within policy manager
#
# Example:
# REPOSITORY_NAME=pinotdev
#
REPOSITORY_NAME=

#
# Policy cache directory
#
# Example:
# POLICY_CACHE_FILE_PATH=/etc/ranger/pinotdev/policycache
#
POLICY_CACHE_FILE_PATH=/etc/ranger/pinotdev/policycache

# Enable row/column level auth (row-level security) on the broker
PINOT_ENABLE_ROW_COLUMN_LEVEL_AUTH=true

# AUDIT configuration

#Should audit be summarized at source
XAAUDIT.SUMMARY.ENABLE=true

# Audit to log4j logger (default audit destination)
XAAUDIT.LOG4J.ENABLE=true

# Enable audit logs to Solr
#Example
#XAAUDIT.SOLR.ENABLE=true
#XAAUDIT.SOLR.URL=http://localhost:6083/solr/ranger_audits
#XAAUDIT.SOLR.FILE_SPOOL_DIR=/var/log/pinot/audit/solr/spool

XAAUDIT.SOLR.ENABLE=false
XAAUDIT.SOLR.URL=NONE
XAAUDIT.SOLR.ZOOKEEPER=NONE
XAAUDIT.SOLR.FILE_SPOOL_DIR=/var/log/pinot/audit/solr/spool

# Enable audit logs to HDFS
#Example
#XAAUDIT.HDFS.ENABLE=true
#XAAUDIT.HDFS.HDFS_DIR=hdfs://node-1.example.com:8020/ranger/audit
#XAAUDIT.HDFS.FILE_SPOOL_DIR=/var/log/pinot/audit/hdfs/spool

XAAUDIT.HDFS.ENABLE=false
XAAUDIT.HDFS.HDFS_DIR=hdfs://__REPLACE__NAME_NODE_HOST:8020/ranger/audit
XAAUDIT.HDFS.FILE_SPOOL_DIR=/var/log/pinot/audit/hdfs/spool

#
# SSL Client Certificate Information
#
# Only needed for 2-way SSL to Ranger Admin. Passwords are stored in plain
# properties here (Pinot has no Hadoop JCEKS credential-provider flow).
#
# Example:
# SSL_KEYSTORE_FILE_PATH=/etc/pinot/conf/ranger-plugin-keystore.jks
# SSL_KEYSTORE_PASSWORD=none
# SSL_TRUSTSTORE_FILE_PATH=/etc/pinot/conf/ranger-plugin-truststore.jks
# SSL_TRUSTSTORE_PASSWORD=none
#
SSL_KEYSTORE_FILE_PATH=/etc/pinot/conf/ranger-plugin-keystore.jks
SSL_KEYSTORE_PASSWORD=none
SSL_TRUSTSTORE_FILE_PATH=/etc/pinot/conf/ranger-plugin-truststore.jks
SSL_TRUSTSTORE_PASSWORD=none
